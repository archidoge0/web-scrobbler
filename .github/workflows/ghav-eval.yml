name: GHAV Web Scrobbler timing

on:
  push:
    branches:
      - 'codex/ghav-ws-*'

permissions:
  contents: read

jobs:
  lint:
    name: Run linters
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          cache: npm
          node-version-file: .nvmrc
      - name: Install dependencies
        run: npm ci
      - name: Run linters (parallel)
        run: |-
          set +e
          bash -e -o pipefail -c 'npm run lint:eslint' &
          ghav_pid_1=$!
          bash -e -o pipefail -c 'npm run lint:stylelint' &
          ghav_pid_2=$!
          bash -e -o pipefail -c 'npm run lint:prettier' &
          ghav_pid_3=$!
          bash -e -o pipefail -c 'npm run lint:markdown' &
          ghav_pid_4=$!
          ghav_status=0
          wait "$ghav_pid_1" || ghav_status=1
          wait "$ghav_pid_2" || ghav_status=1
          wait "$ghav_pid_3" || ghav_status=1
          wait "$ghav_pid_4" || ghav_status=1
          exit "$ghav_status"
        shell: bash
        env:
          CI: 'true'
